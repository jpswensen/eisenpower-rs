version: '3.8'
services:
  eisenhower:
    build: .
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - EISENPOWER_USERS=${EISENPOWER_USERS:-admin:password}
      - EISENPOWER_DATA_DIR=/app/data
      - EISENPOWER_SESSION_SECRET=${EISENPOWER_SESSION_SECRET:-change-me-for-shared-deployments}
      - PORT=${PORT:-8080}
    volumes:
      - eisenhower_data:/app/data
    restart: unless-stopped
volumes:
  eisenhower_data:
    driver: local
